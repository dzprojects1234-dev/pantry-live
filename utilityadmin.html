<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Utility Admin Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; background: #1e293b; color: white; padding: 1rem; }
        .container { max-width: 800px; margin: 0 auto; background: #0f172a; padding: 2rem; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        h1 { margin-bottom: 1.5rem; color: #10b981; text-align: center; }
        h3 { margin-top: 1.5rem; margin-bottom: 1rem; color: #cbd5e1; border-bottom: 1px solid #334155; padding-bottom: 0.5rem; }
        
        .login-box { display: flex; flex-direction: column; gap: 10px; max-width: 300px; margin: 0 auto; }
        .login-box input { padding: 0.8rem; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
        .login-box button { padding: 0.8rem; border-radius: 8px; border: none; background: #3b82f6; color: white; font-weight: bold; cursor: pointer; }

        .hidden { display: none !important; }

        table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
        th, td { padding: 0.8rem; border-bottom: 1px solid #334155; text-align: left; }
        th { color: #94a3b8; }
        
        .btn-paid { background: #10b981; color: white; padding: 0.4rem 0.8rem; border-radius: 6px; border: none; cursor: pointer; font-weight: bold;}
        .status-paid { color: #10b981; font-weight: bold; }
        .status-unpaid { color: #ef4444; font-weight: bold; }
        
        .action-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .btn-refresh { background: #64748b; color: white; padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; }
        .btn-logout { background: #ef4444; color: white; padding: 0.5rem 1rem; border-radius: 8px; border: none; cursor: pointer; }

        /* Form Bill Styles */
        .bill-form { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; background: #1e293b; padding: 1rem; border-radius: 8px; border: 1px solid #334155; }
        .bill-form input, .bill-form select { padding: 0.6rem; border-radius: 6px; border: 1px solid #334155; background: #0f172a; color: white; width: 100%; font-family: inherit;}
        .bill-form button { background: #8b5cf6; color: white; border: none; padding: 0.6rem; border-radius: 6px; font-weight: bold; cursor: pointer; width: 100%;}
        .bill-form button:hover { background: #7c3aed; }
        .form-row-full { grid-column: 1 / -1; }
    </style>
</head>
<body>

    <div class="container">
        <h1>🛠️ Utility Admin Panel</h1>

        <!-- LOGIN SECTION -->
        <div id="loginSection">
            <h3>Admin Login</h3>
            <div class="login-box">
                <input type="password" id="adminPassword" placeholder="Enter Admin Password">
                <button onclick="login()">Login</button>
            </div>
            <p id="loginError" style="color: red; text-align: center; margin-top: 10px; display: none;">Invalid Password!</p>
        </div>

        <!-- DASHBOARD SECTION (Hidden initially) -->
        <div id="dashboardSection" class="hidden">
            
        <!-- BAHAGIAN 1: UPDATE BILL (Fasa 3 - Dropdown Version) -->
        <h3>📝 Update Utility Bill (One Month, All Types)</h3>
        <div class="bill-form">
            <!-- Dropdown Bulan & Tahun -->
            <div class="form-row-full" style="display: flex; gap: 10px;">
                <select id="billMonthSelect" style="flex: 1;">
                    <option value="Jan">January</option>
                    <option value="Feb">February</option>
                    <option value="Mar">March</option>
                    <option value="Apr">April</option>
                    <option value="May">May</option>
                    <option value="Jun">June</option>
                    <option value="Jul">July</option>
                    <option value="Aug">August</option>
                    <option value="Sep">September</option>
                    <option value="Oct">October</option>
                    <option value="Nov">November</option>
                    <option value="Dec">December</option>
                </select>
                <select id="billYearSelect" style="flex: 1;">
                    <option value="2024">2024</option>
                    <option value="2025">2025</option>
                    <option value="2026" selected>2026</option>
                    <option value="2027">2027</option>
                    <option value="2028">2028</option>
                </select>
            </div>
            
            <input type="number" id="billElec" step="0.01" min="0" placeholder="⚡ Electricity ($)">
            <input type="number" id="billWater" step="0.01" min="0" placeholder="💧 Water ($)">
            <input type="number" id="billGas" step="0.01" min="0" placeholder="🔥 Gas ($)">
            <button class="form-row-full" onclick="saveBill()" id="btnSaveBill">💾 Save All Bills</button>
                </div>
            </div>
            
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Name / Entity</th>
                        <th>Intent</th>
                        <th>Amount</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="pledgeListBody">
                    <tr><td colspan="5" style="text-align:center;">Loading data...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // --- KONFIGURASI ---
        const API_BASE_URL = 'https://frosty-frog-9bafpantry.dz-projects1234.workers.dev';
        const MOSQUE_ID = 'test';

        // --- AUTH LOGIC ---
        let authToken = localStorage.getItem('utilityAdminToken') || null;

        function login() {
            const password = document.getElementById('adminPassword').value;
            
            fetch(`${API_BASE_URL}/api/pantry/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ mosqueId: MOSQUE_ID, password: password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.success) {
                    authToken = data.token;
                    localStorage.setItem('utilityAdminToken', authToken);
                    showDashboard();
                } else {
                    document.getElementById('loginError').style.display = 'block';
                }
            })
            .catch(err => alert("Network error: " + err));
        }

        function logout() {
            authToken = null;
            localStorage.removeItem('utilityAdminToken');
            document.getElementById('dashboardSection').classList.add('hidden');
            document.getElementById('loginSection').classList.remove('hidden');
            document.getElementById('adminPassword').value = '';
        }

        function showDashboard() {
            document.getElementById('loginSection').classList.add('hidden');
            document.getElementById('dashboardSection').classList.remove('hidden');
            fetchPledges();
        }

             // --- LOGIK SIMPAN BIL (Fasa 3) ---
            function saveBill() {
            // Gabungkan bulan dan tahun (contoh: "Dec" + " " + "2026")
            const selectedMonth = document.getElementById('billMonthSelect').value;
            const selectedYear = document.getElementById('billYearSelect').value;
            const bill_month = `${selectedMonth} ${selectedYear}`;

            const elec = parseFloat(document.getElementById('billElec').value) || 0;
            const water = parseFloat(document.getElementById('billWater').value) || 0;
            const gas = parseFloat(document.getElementById('billGas').value) || 0;
            const btn = document.getElementById('btnSaveBill');

            if (!bill_month) {
                alert("❌ Please enter the month (e.g. Nov 2026).");
                return;
            }
            if (elec <= 0 && water <= 0 && gas <= 0) {
                alert("❌ Please enter at least one amount (Electricity, Water, or Gas).");
                return;
            }

            btn.innerText = "⏳ Saving...";
            btn.disabled = true;

            fetch(`${API_BASE_URL}/api/utility/bills/bulk?mosque=${MOSQUE_ID}`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ bill_month, elec, water, gas })
            })
            .then(res => {
                if (!res.ok) throw new Error("Unauthorized or server error");
                return res.json();
            })
            .then(data => {
                if (data.success) {
                    alert(`✅ Bills for ${bill_month} saved!\n\n` +
                          `⚡ Electricity: $${elec.toFixed(2)}\n` +
                          `💧 Water: $${water.toFixed(2)}\n` +
                          `🔥 Gas: $${gas.toFixed(2)}`);
                    document.getElementById('billElec').value = '';
                    document.getElementById('billWater').value = '';
                    document.getElementById('billGas').value = '';
                } else {
                    alert("❌ Failed: " + (data.error || "Unknown error"));
                }
            })
            .catch(err => {
                alert("❌ Failed to save bill. Your session may have expired.");
                console.error(err);
            })
            .finally(() => {
                btn.innerText = "💾 Save All Bills";
                btn.disabled = false;
            });
        }

        // --- LOGIK IKAR (PLEDGES) ---
        function fetchPledges() {
            const tbody = document.getElementById('pledgeListBody');
            tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">Fetching data...</td></tr>';

            fetch(`${API_BASE_URL}/api/utility/pledges?mosque=${MOSQUE_ID}`, {
                method: 'GET',
                headers: { 'Authorization': `Bearer ${authToken}` }
            })
            .then(res => {
                if(!res.ok) throw new Error("Unauthorized");
                return res.json();
            })
            .then(pledges => {
                tbody.innerHTML = '';
                if (pledges.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;">No pledges found.</td></tr>';
                    return;
                }

                pledges.forEach(p => {
                    const tr = document.createElement('tr');
                    const actionBtn = p.status === 'Paid' 
                        ? `<span class="status-paid">PAID ✅</span>` 
                        : `<button class="btn-paid" onclick="markAsPaid(${p.id})">Mark Paid</button>`;

                    tr.innerHTML = `
                        <td>#${p.id}</td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.intent}</td>
                        <td>$${parseFloat(p.amount).toFixed(2)}</td>
                        <td>${actionBtn}</td>
                    `;
                    tbody.appendChild(tr);
                });
            })
            .catch(err => {
                tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:red;">Failed to load. Session may have expired.</td></tr>';
                logout();
            });
        }

        function markAsPaid(id) {
            if(!confirm("Confirm you have received the cash payment?")) return;

            fetch(`${API_BASE_URL}/api/utility/paid?mosque=${MOSQUE_ID}`, {
                method: 'POST',
                headers: { 
                    'Authorization': `Bearer ${authToken}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ id: id })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success) {
                    fetchPledges(); 
                } else {
                    alert("Failed to update.");
                }
            });
        }

        // --- INITIALIZATION ---
        window.onload = () => {
            if (authToken) {
                showDashboard();
            }
        };
    </script>
</body>
</html>
