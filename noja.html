<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Noja Masjid App</title>
<style>
  :root {
    --bg: #0f172a; --card: #1e293b; --accent: #22c55e; --accent2: #38bdf8;
    --text: #e2e8f0; --muted: #94a3b8; --warn: #f59e0b; --danger: #ef4444;
    --border: #334155; --input-bg: #0b1220;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); padding: 16px; padding-bottom: 120px;
    line-height: 1.5;
  }
  
  /* Top Bar & Buttons */
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 10px; }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .btn-lang, .btn-tool { 
    background: var(--border); color: var(--text); border: none; 
    padding: 6px 12px; border-radius: 6px; font-weight: 700; 
    font-size: 0.8rem; cursor: pointer; width: auto; 
  }
  .btn-lang { background: var(--accent2); color: #0f172a; }
  .btn-gallery { background: #8b5cf6; color: white; } /* Warna ungu untuk Galeri */
  
  header {
    text-align: center; margin-bottom: 20px; padding: 16px;
    background: linear-gradient(135deg, #166534, #065f46); border-radius: 16px;
  }
  header h1 { margin: 0; font-size: 1.3rem; }
  header p { margin: 6px 0 0; color: #bbf7d0; font-size: 0.85rem; }
  .date-display { font-size: 0.95rem; font-weight: bold; color: #fff; margin-top: 8px; }
  .clock { font-size: 1.5rem; font-weight: 700; margin-top: 4px; color: #fff; font-variant-numeric: tabular-nums; }

  /* Progress */
  .progress-wrap { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 10px 0; margin-bottom: 8px; }
  .progress-bar { height: 10px; background: var(--border); border-radius: 99px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 99px; transition: width 0.3s; }
  .progress-text { text-align: center; font-size: 0.8rem; color: var(--muted); margin-top: 6px; }

  /* Sections */
  .section { background: var(--card); border-radius: 14px; margin-bottom: 14px; overflow: hidden; border: 1px solid var(--border); }
  .section-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; cursor: pointer; user-select: none; background: #243447; flex-wrap: wrap; }
  .section-head .time { background: var(--accent2); color: #0f172a; font-weight: 700; font-size: 0.72rem; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
  .section-head h2 { margin: 0; font-size: 0.95rem; flex: 1; }
  .section-head .arrow { transition: transform 0.25s; color: var(--muted); }
  .section.open .arrow { transform: rotate(90deg); }
  .section-body { display: none; padding: 6px 16px 14px; }
  .section.open .section-body { display: block; }

  /* Tasks */
  .task { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-bottom: 1px solid #2d3b4f; }
  .task:last-child { border-bottom: none; }
  .task input[type="checkbox"] {
    appearance: none; width: 22px; height: 22px; min-width: 22px;
    border: 2px solid var(--muted); border-radius: 6px; margin-top: 2px;
    cursor: pointer; position: relative; transition: 0.2s;
  }
  .task input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
  .task input[type="checkbox"]:checked::after { content: "✓"; position: absolute; color: #0f172a; font-weight: 900; font-size: 15px; left: 4px; top: -2px; }
  .task label { flex: 1; font-size: 0.95rem; cursor: pointer; }
  .task input:checked + label { color: var(--muted); text-decoration: line-through; }
  .note { font-size: 0.8rem; color: var(--warn); margin-top: 4px; display: block; }

  /* Edit Mode Inputs */
  .edit-input { width: 100%; padding: 8px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; font-family: inherit; margin-bottom: 4px; }
  .btn-sm { padding: 6px 10px; font-size: 0.75rem; border-radius: 6px; cursor: pointer; border: none; font-weight: bold; }
  .btn-delete { background: var(--danger); color: white; margin-left: 8px; }
  .btn-add { background: var(--accent); color: #0f172a; margin-top: 10px; width: 100%; }
  .btn-del-sec { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; margin-left: auto; }

  /* Adhoc Grid & Notes */
  .adhoc-section { margin-top: 24px; }
  .adhoc-section h3 { margin-bottom: 12px; font-size: 1.05rem; color: var(--accent2); }
  .adhoc-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; }
  .adhoc-card { background: var(--card); padding: 12px; border-radius: 12px; border: 1px solid var(--border); }
  .adhoc-card h4 { margin: 0 0 8px 0; font-size: 0.95rem; color: var(--text); }
  .adhoc-textarea { width: 100%; min-height: 80px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 10px; font-family: inherit; resize: vertical; }
  .notes-section { background: var(--card); padding: 16px; border-radius: 14px; border: 1px solid var(--border); margin-top: 24px; }
  .notes-section h3 { margin: 0 0 10px 0; font-size: 1.05rem; color: var(--accent2); }
  .notes-textarea { width: 100%; min-height: 100px; background: var(--input-bg); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 12px; font-family: inherit; resize: vertical; }

  /* Footer */
  footer { position: fixed; bottom: 0; left: 0; right: 0; background: #0b1220; padding: 12px 16px; display: flex; gap: 10px; border-top: 1px solid var(--border); z-index: 20; flex-wrap: wrap; }
  button.main-btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-weight: 600; font-size: 0.9rem; cursor: pointer; background: var(--border); color: var(--text); transition: 0.2s; }
  button.main-btn:active { opacity: 0.8; }
  .btn-primary { background: var(--accent2) !important; color: #0f172a !important; }
  .btn-danger { background: var(--danger) !important; color: white !important; }
  .badge-done { font-size: 0.7rem; background: var(--accent); color: #0f172a; padding: 2px 6px; border-radius: 5px; font-weight: 700; display: none; }
  .section.complete .badge-done { display: inline-block; }

  /* MODAL (Galeri & Gambar) */
  .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 100; flex-direction: column; }
  .modal-header { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: var(--card); border-bottom: 1px solid var(--border); }
  .modal-header h2 { margin: 0; font-size: 1.2rem; }
  .modal-body { padding: 16px; overflow-y: auto; flex: 1; }
  .btn-close { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; }
  
  /* Galeri Gambar Grid */
  .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 12px; }
  .gallery-item { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid var(--border); display: flex; flex-direction: column; }
  .gallery-item img { width: 100%; height: 120px; object-fit: cover; cursor: pointer; }
  .gallery-item-info { padding: 8px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .gallery-item-title { font-size: 0.85rem; font-weight: bold; margin-bottom: 8px; word-wrap: break-word; }
  .gallery-item-actions { display: flex; gap: 6px; }
  .gallery-item-actions button { flex: 1; font-size: 0.7rem; padding: 4px; }

  /* Print Styles */
  @media print {
    body { background: white; color: black; padding: 0; }
    header, .progress-wrap, footer, .top-bar, .adhoc-section, .notes-section, .btn-sm, .btn-delete, .btn-add, .btn-del-sec, .arrow { display: none !important; }
    .section { border: 1px solid #ccc; page-break-inside: avoid; margin-bottom: 15px; background: white; }
    .section-head { background: #eee !important; color: black; }
    .section-body { display: block !important; }
    .task label { color: black !important; text-decoration: none !important; }
    .note { color: #555 !important; }
    input[type="checkbox"] { border: 2px solid black !important; }
    input[type="checkbox"]:checked::after { color: black !important; }
  }
</style>
</head>
<body>

<div class="top-bar">
  <div style="font-weight: bold; font-size: 1.1rem;">🕌 Noja Masjid</div>
  <div class="btn-group">
    <button class="btn-tool btn-gallery" onclick="openGallery()">📸 Galeri Rujukan</button>
    <button class="btn-tool" onclick="backupJSON()" title="Backup">📥 Backup</button>
    <button class="btn-tool" onclick="document.getElementById('restoreFile').click()" title="Restore">📤 Restore</button>
    <button class="btn-tool" onclick="window.print()" title="Print PDF">🖨️ Print</button>
    <button class="btn-lang" id="langBtn" onclick="toggleLang()">EN</button>
  </div>
  <input type="file" id="restoreFile" accept=".json" style="display:none" onchange="restoreJSON(this)">
</div>

<header>
  <h1 id="title">Prosedur Kerja Noja Masjid</h1>
  <p id="subtitle">Rutin Harian · 4.30 pagi – 9.00 pagi</p>
  <div class="date-display" id="dateDisplay">--</div>
  <div class="clock" id="clock">--:--:--</div>
</header>

<div class="progress-wrap">
  <div class="progress-bar"><div class="progress-fill" id="fill"></div></div>
  <div class="progress-text" id="progressText">0 / 0 selesai</div>
</div>

<div id="sections"></div>

<div class="adhoc-section">
  <h3 id="adhocTitle">📌 Tugasan Mingguan</h3>
  <div class="adhoc-grid" id="adhocGrid"></div>
</div>

<div class="notes-section">
  <h3 id="notesTitle">📝 Nota Peribadi</h3>
  <textarea class="notes-textarea" id="mainNotes" placeholder="Tulis nota di sini..."></textarea>
</div>

<footer>
  <button class="main-btn" id="btnExpand" onclick="expandAll()">Buka Semua</button>
  <button class="main-btn btn-primary" id="btnEdit" onclick="toggleEditMode()">✏️ Edit</button>
  <button class="main-btn btn-danger" id="btnReset" onclick="resetAll()">Reset</button>
</footer>

<!-- Modal Galeri Rujukan -->
<div id="galleryModal" class="modal">
  <div class="modal-header">
    <h2>📸 Galeri Rujukan</h2>
    <button class="btn-close" onclick="closeGallery()">Tutup</button>
  </div>
  <div class="modal-body">
    <button class="btn-tool btn-primary" style="width: 100%; margin-bottom: 16px; padding: 12px; font-size: 1rem;" onclick="triggerGalleryUpload()">+ Tambah Gambar Baru</button>
    <div class="gallery-grid" id="galleryGrid"></div>
  </div>
</div>

<!-- Modal Full Image Viewer -->
<div id="imgModal" class="modal" style="justify-content: center; align-items: center; background: rgba(0,0,0,0.95);" onclick="if(event.target===this) this.style.display='none'">
  <img id="imgModalSrc" style="max-width: 100%; max-height: 100%; object-fit: contain;">
</div>

<script>
// --- TRANSLATIONS ---
const i18n = {
  ms: {
    title: "Prosedur Kerja Noja Masjid", subtitle: "Rutin Harian · 4.30 pagi – 9.00 pagi",
    expand: "Buka Semua", edit: "✏️ Edit", save: "💾 Simpan", reset: "Reset",
    progress: "selesai", adhocTitle: "📌 Tugasan Mingguan",
    notesTitle: "📝 Nota Peribadi", notesPlc: "Tulis nota di sini...",
    days: ["Isnin", "Selasa", "Rabu", "Khamis", "Jumaat", "Sabtu", "Ahad"],
    adhocPlc: "Contoh: Sedekah roti, tambah mic...",
    resetConfirm: "Padam semua checklist, adhoc, dan nota?",
    addTask: "+ Tambah Tugasan", delTask: "Padam", delSec: "Padam Kotak",
    addSec: "+ Tambah Kotak Baru", 
    backupDone: "Backup berjaya dimuat turun!", restoreSuccess: "Data berjaya dipulihkan! Sila refresh page.", restoreError: "Fail tidak sah."
  },
  en: {
    title: "Mosque Maintenance Procedure", subtitle: "Daily Routine · 4.30 am – 9.00 am",
    expand: "Expand All", edit: "✏️ Edit", save: "💾 Save", reset: "Reset",
    progress: "done", adhocTitle: "📌 Weekly Tasks",
    notesTitle: "📝 Personal Notes", notesPlc: "Write notes here...",
    days: ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"],
    adhocPlc: "E.g: Bread donation, extra mic...",
    resetConfirm: "Clear all checklists, adhoc, and notes?",
    addTask: "+ Add Task", delTask: "Delete", delSec: "Delete Box",
    addSec: "+ Add New Box", 
    backupDone: "Backup downloaded successfully!", restoreSuccess: "Data restored! Please refresh page.", restoreError: "Invalid file."
  }
};

let currentLang = localStorage.getItem("noja_lang") || "ms";
let isEditMode = false;

// --- DATA DEFAULT ---
const defaultData = [
  {
    time: "4.30 – 4.45",
    title: { ms: "Buka Kunci & Keselamatan", en: "Unlock & Safety" },
    tasks: [
      { t: { ms: "Buka kunci tangga & pintu utama", en: "Unlock stairs & main doors" } },
      { t: { ms: "On suis utama (DB) & sistem lif", en: "On main switch (DB) & lift system" } },
      { t: { ms: "Buka tingkap / aktifkan kipas", en: "Open windows / turn on fans" } },
      { t: { ms: "Semak kebersihan luar", en: "Check outside cleanliness" } }
    ]
  },
  {
    time: "4.45 – 5.00",
    title: { ms: "Persiapan Subuh & Live", en: "Subuh Prep & Live" },
    tasks: [
      { t: { ms: "Pasang PA system & mikrofon", en: "Set up PA system & microphone" } },
      { t: { ms: "On sistem Sound & Aircon (Daikin/Mitsubishi)", en: "On Sound & Aircon systems (Daikin/Mitsubishi)" } },
      { t: { ms: "Setup Live Streaming (Facebook & OBS)", en: "Setup Live Streaming (Facebook & OBS)" } },
      { t: { ms: "Semak arah kiblat & saf", en: "Check qiblat & saf" } }
    ]
  },
  {
    time: "5.00 – 5.30",
    title: { ms: "Semasa Solat Subuh", en: "During Subuh" },
    tasks: [
      { t: { ms: "Pastikan Live Streaming berjalan lancar", en: "Ensure Live Streaming is smooth" } },
      { t: { ms: "Kemas kasut di rak", en: "Tidy shoes on rack" } },
      { t: { ms: "Lihat keperluan jemaah", en: "Attend to jemaah needs" } }
    ]
  },
  {
    time: "5.30 – 6.30",
    title: { ms: "Pembersihan & Karpet PMD", en: "Cleaning & PMD Carpet" },
    tasks: [
      { t: { ms: "Sapu & mop ruang solat", en: "Sweep & mop prayer hall" } },
      { t: { ms: "Kemas karpet tempat PMD (elak jemaah tersadung)", en: "Tidy PMD carpet area (prevent tripping)" } },
      { t: { ms: "Bersihkan tandas & tempat wuduk", en: "Clean toilets & ablution area" } },
      { t: { ms: "Kosongkan tong sampah", en: "Empty trash bins" } }
    ]
  },
  {
    time: "6.30 – 7.30",
    title: { ms: "Semakan & QR Clocking", en: "Checking & QR Clocking" },
    tasks: [
      { t: { ms: "Scan QR Code di 11 lokasi masjid", en: "Scan QR Code at 11 mosque locations" } },
      { t: { ms: "Periksa panel Aircon (Daikin/Mitsubishi)", en: "Check Aircon panels (Daikin/Mitsubishi)" } },
      { t: { ms: "Periksa panel Sound System", en: "Check Sound System panel" } },
      { t: { ms: "Semak lampu rosak & paip bocor", en: "Check broken lights & leaks" } }
    ]
  },
  {
    time: "7.30 – 8.30",
    title: { ms: "Persiapan Aktiviti / Kelas", en: "Activity / Class Prep" },
    tasks: [
      { t: { ms: "Sediakan tabung-tabung kuliah ikut label", en: "Prepare donation boxes per label" } },
      { t: { ms: "Susun kerusi / meja kelas", en: "Arrange class chairs / tables" } },
      { t: { ms: "Pastikan PA & projektor berfungsi", en: "Ensure PA & projector work" } },
      { t: { ms: "Sediakan air minuman", en: "Prepare drinking water" } }
    ]
  },
  {
    time: "8.30 – 9.00",
    title: { ms: "Tutup Syif & Laporan", en: "End Shift & Report" },
    tasks: [
      { t: { ms: "Off sistem Sound & Aircon", en: "Off Sound & Aircon systems" } },
      { t: { ms: "Off Live Streaming (OBS)", en: "Off Live Streaming (OBS)" } },
      { t: { ms: "Off sistem Lif (jika on duty)", en: "Off Lift system (if on duty)" } },
      { t: { ms: "Kunci semula tangga & pintu", en: "Lock stairs & doors again" } },
      { t: { ms: "Catat dalam buku log", en: "Log in the book" } }
    ]
  }
];

// --- STORAGE KEYS ---
const K_TASKS = "noja_tasks_v4";
const K_CHECKS = "noja_checks_v4";
const K_ADHOC = "noja_adhoc_v4";
const K_NOTES = "noja_notes_v4";
const K_GALLERY = "noja_gallery_v4"; // Array of { id, title, base64 }

let tasksData = JSON.parse(localStorage.getItem(K_TASKS)) || defaultData;
let checksData = JSON.parse(localStorage.getItem(K_CHECKS)) || {};
let adhocData = JSON.parse(localStorage.getItem(K_ADHOC)) || {};
let notesData = localStorage.getItem(K_NOTES) || "";
let galleryData = JSON.parse(localStorage.getItem(K_GALLERY)) || [];

// --- RENDER ---
function renderTexts() {
  const t = i18n[currentLang];
  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").textContent = t.subtitle;
  document.getElementById("langBtn").textContent = currentLang === "ms" ? "EN" : "BM";
  document.getElementById("btnExpand").textContent = t.expand;
  document.getElementById("btnEdit").textContent = isEditMode ? t.save : t.edit;
  document.getElementById("btnReset").textContent = t.reset;
  document.getElementById("adhocTitle").textContent = t.adhocTitle;
  document.getElementById("notesTitle").textContent = t.notesTitle;
  document.getElementById("mainNotes").placeholder = t.notesPlc;
  
  document.getElementById("progressText").textContent = 
    `${Object.values(checksData).filter(Boolean).length} / ${countAllTasks()} ${t.progress}`;
}

function countAllTasks() {
  return tasksData.reduce((acc, sec) => acc + sec.tasks.length, 0);
}

function renderTasks() {
  const container = document.getElementById("sections");
  container.innerHTML = "";
  const t = i18n[currentLang];
  
  tasksData.forEach((sec, si) => {
    const div = document.createElement("div");
    div.className = "section";
    div.id = "sec" + si;

    const head = document.createElement("div");
    head.className = "section-head";
    
    head.innerHTML = `
      <span class="time">${sec.time}</span>
      <h2>${sec.title[currentLang]}</h2>
      <span class="badge-done">DONE</span>
      ${isEditMode ? `<button class="btn-sm btn-del-sec" onclick="deleteSection(${si})">${t.delSec}</button>` : ''}
      <span class="arrow">▶</span>`;
      
    if (!isEditMode) head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const body = document.createElement("div");
    body.className = "section-body";

    sec.tasks.forEach((task, ti) => {
      const key = `s${si}_t${ti}`;
      const wrap = document.createElement("div");
      wrap.className = "task";

      if (isEditMode) {
        wrap.style.flexDirection = "column";
        wrap.innerHTML = `
          <input type="text" class="edit-input" value="${task.t[currentLang]}" 
            onchange="updateTaskText(${si}, ${ti}, this.value)">
          <div style="display:flex; width:100%; gap:8px; align-items:center;">
             <input type="text" class="edit-input" style="flex:1; margin-bottom:0; font-size:0.8rem;" 
                placeholder="Nota (optional)" value="${task.n ? task.n[currentLang] : ''}" 
                onchange="updateTaskNote(${si}, ${ti}, this.value)">
             <button class="btn-sm btn-delete" onclick="deleteTask(${si}, ${ti})">${t.delTask}</button>
          </div>
        `;
      } else {
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = key;
        cb.checked = !!checksData[key];
        cb.onchange = () => {
          checksData[key] = cb.checked;
          localStorage.setItem(K_CHECKS, JSON.stringify(checksData));
          updateProgress();
        };

        const lbl = document.createElement("label");
        lbl.htmlFor = key;
        lbl.innerHTML = task.t[currentLang] +
          (task.n ? `<span class="note">${task.n[currentLang]}</span>` : "");

        wrap.appendChild(cb);
        wrap.appendChild(lbl);
      }
      body.appendChild(wrap);
    });

    if (isEditMode) {
      const addBtn = document.createElement("button");
      addBtn.className = "btn-sm btn-add";
      addBtn.textContent = t.addTask;
      addBtn.onclick = () => addTask(si);
      body.appendChild(addBtn);
    }

    div.appendChild(body);
    container.appendChild(div);
  });
  
  if (isEditMode) {
    const addSecBtn = document.createElement("button");
    addSecBtn.className = "main-btn btn-primary";
    addSecBtn.style = "width:100%; margin-bottom:20px;";
    addSecBtn.textContent = t.addSec;
    addSecBtn.onclick = addSection;
    container.appendChild(addSecBtn);
  }
  
  updateProgress();
}

function renderAdhoc() {
  const grid = document.getElementById("adhocGrid");
  grid.innerHTML = "";
  const days = i18n[currentLang].days;
  
  for (let i = 0; i < 7; i++) {
    const card = document.createElement("div");
    card.className = "adhoc-card";
    card.innerHTML = `
      <h4>${days[i]}</h4>
      <textarea class="adhoc-textarea" id="adhoc_${i}" 
        placeholder="${i18n[currentLang].adhocPlc}"
        oninput="saveAdhoc(${i}, this.value)">${adhocData[i] || ""}</textarea>
    `;
    grid.appendChild(card);
  }
}

// --- GALLERY LOGIC ---
function openGallery() {
  document.getElementById("galleryModal").style.display = "flex";
  renderGallery();
}

function closeGallery() {
  document.getElementById("galleryModal").style.display = "none";
}

function renderGallery() {
  const grid = document.getElementById("galleryGrid");
  grid.innerHTML = "";
  
  if (galleryData.length === 0) {
    grid.innerHTML = "<p style='color:var(--muted); grid-column:1/-1; text-align:center;'>Tiada gambar lagi. Tekan butang di atas untuk tambah.</p>";
    return;
  }
  
  // Susun dari gambar terbaru
  const reversed = [...galleryData].reverse();
  
  reversed.forEach((item, index) => {
    const card = document.createElement("div");
    card.className = "gallery-item";
    card.innerHTML = `
      <img src="${item.base64}" onclick="viewImage('${item.id}')">
      <div class="gallery-item-info">
        <div class="gallery-item-title">${item.title}</div>
        <div class="gallery-item-actions">
          <button class="btn-sm" style="background:var(--accent2); color:#0f172a;" onclick="editGalleryTitle('${item.id}')">Edit</button>
          <button class="btn-sm btn-delete" onclick="deleteGalleryImg('${item.id}')">Padam</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function triggerGalleryUpload() {
  const title = prompt("Masukkan tajuk/keterangan gambar (contoh: Panel Aircon Daikin):");
  if (!title) return; // Batal jika tiada tajuk

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.setAttribute("capture", "environment"); 
  
  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;
    
    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        // Saiz gambar rujukan boleh lebih besar sikit, cth: max width 1000px
        const MAX_WIDTH = 1000; 
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
        
        const base64 = canvas.toDataURL("image/jpeg", 0.75); // Kualiti 75%
        
        galleryData.push({
          id: Date.now().toString(),
          title: title,
          base64: base64
        });
        
        localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
        renderGallery();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function viewImage(id) {
  const item = galleryData.find(g => g.id === id);
  if (item) {
    document.getElementById("imgModalSrc").src = item.base64;
    document.getElementById("imgModal").style.display = "flex";
  }
}

function editGalleryTitle(id) {
  const item = galleryData.find(g => g.id === id);
  if (!item) return;
  const newTitle = prompt("Edit tajuk gambar:", item.title);
  if (newTitle !== null && newTitle.trim() !== "") {
    item.title = newTitle.trim();
    localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
    renderGallery();
  }
}

function deleteGalleryImg(id) {
  if (confirm("Padam gambar ini dari galeri?")) {
    galleryData = galleryData.filter(g => g.id !== id);
    localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
    renderGallery();
  }
}

// --- ACTIONS ---
function toggleLang() {
  currentLang = currentLang === "ms" ? "en" : "ms";
  localStorage.setItem("noja_lang", currentLang);
  renderTexts();
  renderTasks();
  renderAdhoc();
  if(document.getElementById("galleryModal").style.display === "flex") {
     renderGallery();
  }
}

function toggleEditMode() {
  isEditMode = !isEditMode;
  renderTexts();
  renderTasks();
  if (!isEditMode) {
    localStorage.setItem(K_TASKS, JSON.stringify(tasksData));
  }
}

function updateTaskText(si, ti, val) {
  tasksData[si].tasks[ti].t[currentLang] = val;
}

function updateTaskNote(si, ti, val) {
  if(tasksData[si].tasks[ti].n) {
    tasksData[si].tasks[ti].n[currentLang] = val;
  } else {
    tasksData[si].tasks[ti].n = { ms: val, en: val };
  }
}

function deleteTask(si, ti) {
  if(confirm(i18n[currentLang].delTask + "?")) {
    tasksData[si].tasks.splice(ti, 1);
    renderTasks();
    localStorage.setItem(K_TASKS, JSON.stringify(tasksData));
  }
}

function addTask(si) {
  tasksData[si].tasks.push({
    t: { ms: "Tugasan Baru", en: "New Task" },
    n: { ms: "", en: "" }
  });
  renderTasks();
  localStorage.setItem(K_TASKS, JSON.stringify(tasksData));
}

function deleteSection(si) {
  if(confirm(i18n[currentLang].delSec + "?")) {
    tasksData.splice(si, 1);
    renderTasks();
    localStorage.setItem(K_TASKS, JSON.stringify(tasksData));
  }
}

function addSection() {
  tasksData.push({
    time: "Masa",
    title: { ms: "Kotak Baru", en: "New Box" },
    tasks: [{ t: { ms: "Tugasan Baru", en: "New Task" }, n: { ms: "", en: "" } }]
  });
  renderTasks();
  localStorage.setItem(K_TASKS, JSON.stringify(tasksData));
}

function saveAdhoc(index, val) {
  adhocData[index] = val;
  localStorage.setItem(K_ADHOC, JSON.stringify(adhocData));
}

document.getElementById("mainNotes").addEventListener("input", (e) => {
  localStorage.setItem(K_NOTES, e.target.value);
});

function resetAll() {
  if (confirm(i18n[currentLang].resetConfirm)) {
    checksData = {};
    adhocData = {};
    notesData = "";
    localStorage.removeItem(K_CHECKS);
    localStorage.removeItem(K_ADHOC);
    localStorage.removeItem(K_NOTES);
    document.getElementById("mainNotes").value = "";
    renderTasks();
    renderAdhoc();
    document.querySelectorAll(".task input[type=checkbox]").forEach(c => c.checked = false);
  }
}

function expandAll() {
  document.querySelectorAll(".section").forEach(s => s.classList.toggle("open"));
}

function updateProgress() {
  const all = countAllTasks();
  const done = Object.values(checksData).filter(Boolean).length;
  const pct = all ? (done / all * 100) : 0;
  
  document.getElementById("fill").style.width = pct + "%";
  document.getElementById("progressText").textContent = 
    `${done} / ${all} ${i18n[currentLang].progress} (${Math.round(pct)}%)`;

  tasksData.forEach((sec, si) => {
    const boxes = sec.tasks.map((_, ti) => checksData[`s${si}_t${ti}`]);
    const allDone = boxes.length > 0 && boxes.every(b => b === true);
    const el = document.getElementById("sec" + si);
    if (el) el.classList.toggle("complete", allDone);
  });
}

// --- BACKUP & RESTORE ---
function backupJSON() {
  const backupData = {
    tasks: tasksData,
    checks: checksData,
    adhoc: adhocData,
    notes: notesData,
    gallery: galleryData // Sertakan galeri gambar
  };
  
  const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `NojaMasjid_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  alert(i18n[currentLang].backupDone);
}

function restoreJSON(input) {
  const file = input.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.tasks) {
        tasksData = data.tasks;
        checksData = data.checks || {};
        adhocData = data.adhoc || {};
        notesData = data.notes || "";
        galleryData = data.gallery || [];
        
        localStorage.setItem(K_TASKS, JSON.stringify(tasksData));
        localStorage.setItem(K_CHECKS, JSON.stringify(checksData));
        localStorage.setItem(K_ADHOC, JSON.stringify(adhocData));
        localStorage.setItem(K_NOTES, notesData);
        localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
        
        alert(i18n[currentLang].restoreSuccess);
        location.reload(); 
      } else {
        alert(i18n[currentLang].restoreError);
      }
    } catch (err) {
      alert(i18n[currentLang].restoreError);
    }
  };
  reader.readAsText(file);
  input.value = "";
}

// --- CLOCK ---
function tick() {
  const now = new Date();
  const langCode = currentLang === "ms" ? "ms-SG" : "en-SG";
  
  const dateStr = now.toLocaleDateString(langCode, { 
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
  });
  
  document.getElementById("dateDisplay").textContent = dateStr;
  document.getElementById("clock").textContent = now.toLocaleTimeString(langCode, { hour12: false });
}
setInterval(tick, 1000);

// --- INIT ---
function init() {
  document.getElementById("mainNotes").value = notesData;
  renderTexts();
  renderTasks();
  renderAdhoc();
  tick();
  document.getElementById("sec0").classList.add("open");
}

init();
</script>
