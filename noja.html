// ==========================================
// STATE & VARIABLES
// ==========================================
let currentLang = localStorage.getItem("noja_lang") || "ms";
let currentShift = localStorage.getItem("noja_shift") || "morning";
let isEditMode = false;

const K_TASKS_M = "noja_tasks_m_v6";
const K_TASKS_E = "noja_tasks_e_v6";
const K_CHECKS = "noja_checks_v6";
const K_ADHOC = "noja_adhoc_v6";
const K_NOTES = "noja_notes_v6";
const K_GALLERY = "noja_gallery_v6";
const K_SHIFTLOG = "noja_shiftlog_v1";

let tasksMorning = JSON.parse(localStorage.getItem(K_TASKS_M)) || defaultMorningData;
let tasksEvening = JSON.parse(localStorage.getItem(K_TASKS_E)) || defaultEveningData;

let adhocData = JSON.parse(localStorage.getItem(K_ADHOC)) || {};
let notesData = localStorage.getItem(K_NOTES) || "";
let galleryData = JSON.parse(localStorage.getItem(K_GALLERY)) || [];
let shiftLogData = JSON.parse(localStorage.getItem(K_SHIFTLOG)) || [];

function getCurrentTasks() {
  return currentShift === "morning" ? tasksMorning : tasksEvening;
}

// ==========================================
// RENDER FUNCTIONS (UI UPDATES)
// ==========================================
function renderTexts() {
  const t = i18n[currentLang];

  document.getElementById("title").textContent = t.title;
  document.getElementById("subtitle").textContent =
    currentShift === "morning" ? `${t.subtitle} · 4.30 am – 9.00 am` : `${t.subtitle} · 5.30 pm – 10.30 pm`;
  document.getElementById("langBtn").textContent = currentLang === "ms" ? "EN" : "BM";

  document.getElementById("shiftMorningBtn").textContent = t.shiftMorning;
  document.getElementById("shiftEveningBtn").textContent = t.shiftEvening;
  document.getElementById("shiftMorningBtn").className = currentShift === "morning" ? "shift-btn active" : "shift-btn";
  document.getElementById("shiftEveningBtn").className = currentShift === "evening" ? "shift-btn active" : "shift-btn";

  document.getElementById("btnShiftLog").textContent = t.shiftLogBtn;
  document.getElementById("btnGallery").textContent = t.galleryBtn;
  document.getElementById("btnBackup").textContent = t.backupBtn;
  document.getElementById("btnRestore").textContent = t.restoreBtn;
  document.getElementById("btnPrint").textContent = t.printBtn;
  document.getElementById("btnExpand").textContent = t.expand;
  document.getElementById("btnEdit").textContent = isEditMode ? t.save : t.edit;
  document.getElementById("btnReset").textContent = t.reset;

  document.getElementById("adhocTitle").textContent = t.adhocTitle;
  document.getElementById("notesTitle").textContent = t.notesTitle;
  document.getElementById("mainNotes").placeholder = t.notesPlc;

  document.getElementById("galleryTitle").textContent = t.galleryTitle;
  document.getElementById("btnCloseGallery").textContent = t.closeBtn;
  document.getElementById("btnAddGallery").textContent = t.addImgBtn;

  updateProgress();
}

function countAllTasks() {
  return getCurrentTasks().reduce((acc, sec) => acc + sec.tasks.length, 0);
}

function renderTasks() {
  const container = document.getElementById("sections");
  container.innerHTML = "";
  const t = i18n[currentLang];
  const tasksData = getCurrentTasks();

  tasksData.forEach((sec, si) => {
    const div = document.createElement("div");
    div.className = "section";
    div.id = "sec" + si;

    const head = document.createElement("div");
    head.className = "section-head";

    head.innerHTML = `
      <span class="time">${sec.time}</span>
      <h2>${sec.title[currentLang]}</h2>
      <span class="badge-done">DONE</span>
      ${isEditMode ? `<button class="btn-sm btn-del-sec" onclick="deleteSection(${si})">${t.delSec}</button>` : ''}
      <span class="arrow">▶</span>`;

    if (!isEditMode) head.onclick = () => div.classList.toggle("open");
    div.appendChild(head);

    const body = document.createElement("div");
    body.className = "section-body";

    if (isEditMode) {
      const checkAllBtn = document.createElement("button");
      checkAllBtn.className = "btn-check-all";
      checkAllBtn.textContent = t.checkAll;
      checkAllBtn.onclick = () => {
        sec.tasks.forEach((_, ti) => {
          const key = `s${currentShift}_${si}_t${ti}`;
          checksData[key] = true;
          const cb = document.getElementById(key);
          if (cb) cb.checked = true;
        });
        localStorage.setItem(K_CHECKS, JSON.stringify(checksData));
        updateProgress();
      };
      body.appendChild(checkAllBtn);
    }

    sec.tasks.forEach((task, ti) => {
      const key = `s${currentShift}_${si}_t${ti}`;
      const wrap = document.createElement("div");
      wrap.className = "task";

      if (isEditMode) {
        wrap.style.flexDirection = "column";
        wrap.innerHTML = `
          <input type="text" class="edit-input" value="${task.t[currentLang]}"
            onchange="updateTaskText(${si}, ${ti}, this.value)">
          <div style="display:flex; width:100%; gap:8px; align-items:center;">
             <input type="text" class="edit-input" style="flex:1; margin-bottom:0; font-size:0.8rem;"
                placeholder="Notes / Nota" value="${task.n ? task.n[currentLang] : ''}"
                onchange="updateTaskNote(${si}, ${ti}, this.value)">
             <button class="btn-sm btn-delete" onclick="deleteTask(${si}, ${ti})">${t.delTask}</button>
          </div>
        `;
      } else {
        const cb = document.createElement("input");
        cb.type = "checkbox";
        cb.id = key;
        cb.checked = !!checksData[key];
        cb.onchange = () => {
          checksData[key] = cb.checked;
          localStorage.setItem(K_CHECKS, JSON.stringify(checksData));
          updateProgress();
        };

        const lbl = document.createElement("label");
        lbl.htmlFor = key;
        lbl.innerHTML = task.t[currentLang] +
          (task.n ? `<span class="note">${task.n[currentLang]}</span>` : "");

        wrap.appendChild(cb);
        wrap.appendChild(lbl);
      }
      body.appendChild(wrap);
    });

    if (isEditMode) {
      const addBtn = document.createElement("button");
      addBtn.className = "btn-sm btn-add";
      addBtn.textContent = t.addTask;
      addBtn.onclick = () => addTask(si);
      body.appendChild(addBtn);
    }

    div.appendChild(body);
    container.appendChild(div);
  });

  if (isEditMode) {
    const addSecBtn = document.createElement("button");
    addSecBtn.className = "main-btn btn-primary";
    addSecBtn.style = "width:100%; margin-bottom:20px;";
    addSecBtn.textContent = t.addSec;
    addSecBtn.onclick = addSection;
    container.appendChild(addSecBtn);
  }

  updateProgress();
}

function renderAdhoc() {
  const grid = document.getElementById("adhocGrid");
  grid.innerHTML = "";
  const days = i18n[currentLang].days;

  for (let i = 0; i < 7; i++) {
    const card = document.createElement("div");
    card.className = "adhoc-card";
    card.innerHTML = `
      <h4>${days[i]}</h4>
      <textarea class="adhoc-textarea" id="adhoc_${i}"
        placeholder="${i18n[currentLang].adhocPlc}"
        oninput="saveAdhoc(${i}, this.value)">${adhocData[i] || ""}</textarea>
    `;
    grid.appendChild(card);
  }
}

function updateProgress() {
  const tasksData = getCurrentTasks();
  const all = countAllTasks();
  const done = tasksData.reduce((acc, sec, si) => {
    return acc + sec.tasks.filter((_, ti) => checksData[`s${currentShift}_${si}_t${ti}`] === true).length;
  }, 0);

  const pct = all ? (done / all * 100) : 0;

  document.getElementById("fill").style.width = pct + "%";
  document.getElementById("progressText").textContent =
    `${done} / ${all} ${i18n[currentLang].progress} (${Math.round(pct)}%)`;

  tasksData.forEach((sec, si) => {
    const boxes = sec.tasks.map((_, ti) => checksData[`s${currentShift}_${si}_t${ti}`]);
    const allDone = boxes.length > 0 && boxes.every(b => b === true);
    const el = document.getElementById("sec" + si);
    if (el) el.classList.toggle("complete", allDone);
  });
}

// ==========================================
// SHIFT & EDIT LOGIC
// ==========================================
function setShift(shift) {
  currentShift = shift;
  localStorage.setItem("noja_shift", currentShift);
  isEditMode = false;
  renderTexts();
  renderTasks();
}

function toggleEditMode() {
  isEditMode = !isEditMode;
  renderTexts();
  renderTasks();
  if (!isEditMode) {
    if (currentShift === "morning") {
      localStorage.setItem(K_TASKS_M, JSON.stringify(tasksMorning));
    } else {
      localStorage.setItem(K_TASKS_E, JSON.stringify(tasksEvening));
    }
  }
}

function updateTaskText(si, ti, val) {
  const tasksData = getCurrentTasks();
  tasksData[si].tasks[ti].t[currentLang] = val;
}

function updateTaskNote(si, ti, val) {
  const tasksData = getCurrentTasks();
  if (tasksData[si].tasks[ti].n) {
    tasksData[si].tasks[ti].n[currentLang] = val;
  } else {
    tasksData[si].tasks[ti].n = { ms: val, en: val };
  }
}

function deleteTask(si, ti) {
  if (confirm(i18n[currentLang].confirmDelTask)) {
    const tasksData = getCurrentTasks();
    tasksData[si].tasks.splice(ti, 1);
    renderTasks();
    saveTasksToStorage();
  }
}

function addTask(si) {
  const tasksData = getCurrentTasks();
  tasksData[si].tasks.push({
    t: { ms: "Tugasan Baru", en: "New Task" },
    n: { ms: "", en: "" }
  });
  renderTasks();
  saveTasksToStorage();
}

function deleteSection(si) {
  if (confirm(i18n[currentLang].confirmDelSec)) {
    const tasksData = getCurrentTasks();
    tasksData.splice(si, 1);
    renderTasks();
    saveTasksToStorage();
  }
}

function addSection() {
  const tasksData = getCurrentTasks();
  tasksData.push({
    time: "Time",
    title: { ms: "Kotak Baru", en: "New Box" },
    tasks: [{ t: { ms: "Tugasan Baru", en: "New Task" }, n: { ms: "", en: "" } }]
  });
  renderTasks();
  saveTasksToStorage();
}

function saveTasksToStorage() {
  if (currentShift === "morning") {
    localStorage.setItem(K_TASKS_M, JSON.stringify(tasksMorning));
  } else {
    localStorage.setItem(K_TASKS_E, JSON.stringify(tasksEvening));
  }
}

// ==========================================
// GALLERY LOGIC
// ==========================================
function openGallery() {
  document.getElementById("galleryModal").style.display = "flex";
  renderGallery();
}

function closeGallery() {
  document.getElementById("galleryModal").style.display = "none";
}

function renderGallery() {
  const grid = document.getElementById("galleryGrid");
  grid.innerHTML = "";
  const t = i18n[currentLang];

  if (galleryData.length === 0) {
    grid.innerHTML = `<p style='color:var(--muted); grid-column:1/-1; text-align:center;'>${t.noImgText}</p>`;
    return;
  }

  const reversed = [...galleryData].reverse();

  reversed.forEach((item) => {
    const card = document.createElement("div");
    card.className = "gallery-item";
    card.innerHTML = `
      <img src="${item.base64}" onclick="viewImage('${item.id}')">
      <div class="gallery-item-info">
        <div class="gallery-item-title">${item.title}</div>
        <div class="gallery-item-actions">
          <button class="btn-sm" style="background:var(--accent2); color:#0f172a;" onclick="editGalleryTitle('${item.id}')">${t.editImgBtn}</button>
          <button class="btn-sm btn-delete" onclick="deleteGalleryImg('${item.id}')">${t.delImgBtn}</button>
        </div>
      </div>
    `;
    grid.appendChild(card);
  });
}

function triggerGalleryUpload() {
  const t = i18n[currentLang];
  const title = prompt(t.promptTitle);
  if (!title) return;

  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.setAttribute("capture", "environment");

  input.onchange = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (ev) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement("canvas");
        const MAX_WIDTH = 1000;
        const scale = MAX_WIDTH / img.width;
        canvas.width = MAX_WIDTH;
        canvas.height = img.height * scale;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

        const base64 = canvas.toDataURL("image/jpeg", 0.75);

        galleryData.push({
          id: Date.now().toString(),
          title: title,
          base64: base64
        });

        localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
        renderGallery();
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function viewImage(id) {
  const item = galleryData.find(g => g.id === id);
  if (item) {
    document.getElementById("imgModalSrc").src = item.base64;
    document.getElementById("imgModal").style.display = "flex";
  }
}

function editGalleryTitle(id) {
  const item = galleryData.find(g => g.id === id);
  if (!item) return;
  const newTitle = prompt(i18n[currentLang].promptEditTitle, item.title);
  if (newTitle !== null && newTitle.trim() !== "") {
    item.title = newTitle.trim();
    localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
    renderGallery();
  }
}

function deleteGalleryImg(id) {
  if (confirm(i18n[currentLang].confirmDelImg)) {
    galleryData = galleryData.filter(g => g.id !== id);
    localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
    renderGallery();
  }
}

// ==========================================
// SHIFT LOG MODULE — START
// ==========================================
let slEditId = null;
let slViewDate = new Date();

function slSaveStorage() {
  localStorage.setItem(K_SHIFTLOG, JSON.stringify(shiftLogData));
}

function slPad(n) { return String(n).padStart(2, "0"); }

function slISOtoDisplay(iso) {
  if (!iso) return "";
  const [y, m, d] = iso.split("-");
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${d} ${months[parseInt(m,10)-1]} ${y}`;
}

function slDayName(iso) {
  const d = new Date(iso + "T00:00:00");
  const days = i18n[currentLang].days;
  return days[(d.getDay() + 6) % 7];
}

function slHours(start, end) {
  if (!start || !end) return 0;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  let mins = (eh * 60 + em) - (sh * 60 + sm);
  if (mins <= 0) mins += 24 * 60;
  return mins / 60;
}

function slIsOvernight(start, end) {
  if (!start || !end) return false;
  const [sh, sm] = start.split(":").map(Number);
  const [eh, em] = end.split(":").map(Number);
  return (eh * 60 + em) <= (sh * 60 + sm);
}

function slEntriesForMonth(year, month) {
  const ym = `${year}-${slPad(month + 1)}`;
  return shiftLogData
    .filter(e => e.date.startsWith(ym))
    .sort((a, b) => a.date === b.date ? a.start.localeCompare(b.start) : a.date.localeCompare(b.date));
}

function openShiftLog() {
  document.getElementById("shiftLogModal").style.display = "flex";
  slViewDate = new Date();
  slResetForm();
  renderShiftLog();
}

function closeShiftLog() {
  document.getElementById("shiftLogModal").style.display = "none";
  slEditId = null;
}

function shiftLogPrevMonth() {
  slViewDate.setMonth(slViewDate.getMonth() - 1);
  renderShiftLog();
}

function shiftLogNextMonth() {
  slViewDate.setMonth(slViewDate.getMonth() + 1);
  renderShiftLog();
}

function shiftLogOnTypeChange() {
  const type = document.getElementById("slType").value;
  const s = document.getElementById("slStart");
  const e = document.getElementById("slEnd");
  if (type === "morning") { s.value = "04:30"; e.value = "09:00"; }
  else if (type === "evening") { s.value = "17:30"; e.value = "22:30"; }
  else { s.value = ""; e.value = ""; }
}

function slResetForm() {
  slEditId = null;
  document.getElementById("slDate").value = new Date().toISOString().slice(0, 10);
  document.getElementById("slType").value = "evening";
  shiftLogOnTypeChange();
  document.getElementById("slOT").value = 0;
  document.getElementById("slPH").checked = false;
  document.getElementById("slReason").value = "";
  document.getElementById("slNotes").value = "";
  document.getElementById("btnCancelEdit").style.display = "none";
  slApplyLabels();
}

function slApplyLabels() {
  const t = i18n[currentLang];
  document.getElementById("shiftLogTitleEl").textContent = t.shiftLogTitle;
  document.getElementById("btnShiftLog").textContent = t.shiftLogBtn;
  document.getElementById("lblDate").textContent = t.dateLabel;
  document.getElementById("lblType").textContent = t.typeLabel;
  document.getElementById("lblStart").textContent = t.startLabel;
  document.getElementById("lblEnd").textContent = t.endLabel;
  document.getElementById("lblOT").textContent = t.otLabel;
  document.getElementById("lblPH").textContent = t.phLabel;
  document.getElementById("lblReason").textContent = t.reasonLabel;
  document.getElementById("lblNotes").textContent = t.notesLabel;
  document.getElementById("slReason").placeholder = t.reasonPh;
  document.getElementById("slNotes").placeholder = t.notesPh;
  document.getElementById("btnSaveEntry").textContent = t.saveBtn;
  document.getElementById("btnCancelEdit").textContent = t.cancelBtn;
  document.getElementById("btnLogPrint").textContent = t.printBtnLog;
  document.getElementById("btnLogCSV").textContent = t.csvBtn;
  document.getElementById("btnLogExport").textContent = t.exportBtn;
  const sel = document.getElementById("slType");
  sel.options[0].text = t.morning;
  sel.options[1].text = t.evening;
  sel.options[2].text = t.adhoc;
}

function shiftLogSaveEntry() {
  const date = document.getElementById("slDate").value;
  const type = document.getElementById("slType").value;
  const start = document.getElementById("slStart").value;
  const end = document.getElementById("slEnd").value;
  const ot = parseFloat(document.getElementById("slOT").value) || 0;
  const ph = document.getElementById("slPH").checked;
  const reason = document.getElementById("slReason").value.trim();
  const notes = document.getElementById("slNotes").value.trim();

  if (!date || !start || !end) {
    alert(i18n[currentLang].fillRequired);
    return;
  }

  if (slEditId) {
    const idx = shiftLogData.findIndex(e => e.id === slEditId);
    if (idx >= 0) {
      shiftLogData[idx] = { id: slEditId, date, type, start, end, ot, ph, reason, notes };
    }
  } else {
    shiftLogData.push({ id: Date.now().toString(), date, type, start, end, ot, ph, reason, notes });
  }

  slSaveStorage();
  slResetForm();
  renderShiftLog();
}

function shiftLogEdit(id) {
  const e = shiftLogData.find(x => x.id === id);
  if (!e) return;
  slEditId = id;
  document.getElementById("slDate").value = e.date;
  document.getElementById("slType").value = e.type;
  document.getElementById("slStart").value = e.start;
  document.getElementById("slEnd").value = e.end;
  document.getElementById("slOT").value = e.ot || 0;
  document.getElementById("slPH").checked = !!e.ph;
  document.getElementById("slReason").value = e.reason || "";
  document.getElementById("slNotes").value = e.notes || "";
  document.getElementById("btnCancelEdit").style.display = "block";
  document.getElementById("shiftLogForm").scrollIntoView({ behavior: "smooth", block: "center" });
}

function shiftLogCancelEdit() {
  slResetForm();
}

function shiftLogDelete(id) {
  if (!confirm(i18n[currentLang].confirmDelEntry)) return;
  shiftLogData = shiftLogData.filter(e => e.id !== id);
  slSaveStorage();
  renderShiftLog();
}

function renderShiftLog() {
  if (document.getElementById("shiftLogModal").style.display !== "flex") return;
  slApplyLabels();
  const t = i18n[currentLang];
  const year = slViewDate.getFullYear();
  const month = slViewDate.getMonth();

  const months = ["Jan","Feb","Mac","Apr","Mei","Jun","Jul","Ogos","Sep","Okt","Nov","Dis"];
  const monthsEN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const mLabel = (currentLang === "ms" ? months[month] : monthsEN[month]) + " " + year;
  document.getElementById("shiftLogMonthLabel").textContent = mLabel;

  const thead = document.getElementById("shiftLogThead");
  thead.innerHTML = `<tr>
    <th>${t.dateCol}</th><th>${t.dayCol}</th><th>${t.shiftCol}</th>
    <th>${t.startCol}</th><th>${t.endCol}</th>
    <th style="text-align:right;">${t.baseCol}</th>
    <th style="text-align:right;">${t.otCol}</th>
    <th style="text-align:right;">${t.totalCol}</th>
    <th>${t.phCol}</th>
    <th>${t.reasonCol}</th><th>${t.notesCol}</th>
    <th></th><th></th>
  </tr>`;

  const tbody = document.getElementById("shiftLogTbody");
  const entries = slEntriesForMonth(year, month);
  tbody.innerHTML = "";

  if (entries.length === 0) {
    tbody.innerHTML = `<tr><td colspan="13" style="text-align:center; color:var(--muted); padding:20px;">${t.emptyMonth}</td></tr>`;
  } else {
    entries.forEach(e => {
      const base = slHours(e.start, e.end);
      const total = base + (e.ot || 0);
      const overnight = slIsOvernight(e.start, e.end) ? ' <span class="sl-overnight">+1d</span>' : "";
      const tr = document.createElement("tr");
      tr.innerHTML = `
        <td>${slISOtoDisplay(e.date)}</td>
        <td>${slDayName(e.date)}</td>
        <td>${t[e.type]}</td>
        <td>${e.start}</td>
        <td>${e.end}${overnight}</td>
        <td class="num">${base.toFixed(2)}</td>
        <td class="num">${(e.ot||0).toFixed(2)}</td>
        <td class="num"><strong>${total.toFixed(2)}</strong></td>
        <td>${e.ph ? '<span class="sl-ph-badge">PH</span>' : ''}</td>
        <td class="notes-cell">${e.reason || ''}</td>
        <td class="notes-cell">${e.notes || ''}</td>
        <td><button class="btn-sm" style="background:var(--accent2); color:#0f172a;" onclick="shiftLogEdit('${e.id}')">✏️</button></td>
        <td><button class="btn-sm btn-delete" onclick="shiftLogDelete('${e.id}')">🗑️</button></td>
      `;
      tbody.appendChild(tr);
    });
  }

  renderShiftLogSummary(entries);
}

function renderShiftLogSummary(entries) {
  const t = i18n[currentLang];
  const summary = document.getElementById("shiftLogSummary");

  let mCount = 0, mBase = 0, eCount = 0, eBase = 0, aCount = 0, aBase = 0;
  let totalOT = 0, totalBaseAll = 0, phCount = 0;

  entries.forEach(e => {
    const base = slHours(e.start, e.end);
    totalBaseAll += base;
    totalOT += (e.ot || 0);
    if (e.ph) phCount++;
    if (e.type === "morning") { mCount++; mBase += base; }
    else if (e.type === "evening") { eCount++; eBase += base; }
    else { aCount++; aBase += base; }
  });

  const totalHours = totalBaseAll + totalOT;
  const days = entries.length;
  const avgPerDay = days ? totalHours / days : 0;

  function line(label, val) {
    return `<div class="sl-summary-row"><span>${label}</span><span class="val">${val}</span></div>`;
  }

  let html = `<div style="font-weight:bold; margin-bottom:8px; color:var(--accent2);">${t.workingDays}: ${days}</div>`;
  if (mCount) html += line(`&nbsp;&nbsp;${t.morning}`, `${mCount} ${t.shiftsLabel} · ${mBase.toFixed(2)}h · ${t.avgLabel} ${(mBase/mCount).toFixed(2)}`);
  if (eCount) html += line(`&nbsp;&nbsp;${t.evening}`, `${eCount} ${t.shiftsLabel} · ${eBase.toFixed(2)}h · ${t.avgLabel} ${(eBase/eCount).toFixed(2)}`);
  if (aCount) html += line(`&nbsp;&nbsp;${t.adhoc}`, `${aCount} ${t.shiftsLabel} · ${aBase.toFixed(2)}h · ${t.avgLabel} ${(aBase/aCount).toFixed(2)}`);
  html += line(t.totalBase, totalBaseAll.toFixed(2) + " h");
  html += line(t.totalOT, totalOT.toFixed(2) + " h");
  html += `<div class="sl-summary-row total"><span>${t.totalHours}</span><span class="val">${totalHours.toFixed(2)} h</span></div>`;
  html += line(t.avgPerDay, avgPerDay.toFixed(2) + " h");
  html += line(t.phShifts, phCount);

  let ytdShifts = 0, ytdHrs = 0;
  shiftLogData.forEach(e => {
    const y = parseInt(e.date.slice(0,4), 10);
    if (y === slViewDate.getFullYear()) {
      ytdShifts++;
      ytdHrs += slHours(e.start, e.end) + (e.ot || 0);
    }
  });
  html += `<div style="margin-top:10px; font-size:0.75rem; color:var(--muted); text-align:center;">${t.ytdLine} ${slViewDate.getFullYear()}: ${ytdHrs.toFixed(1)}h · ${ytdShifts} ${t.ytdShifts}</div>`;

  summary.innerHTML = html;
}

function shiftLogCSV() {
  const year = slViewDate.getFullYear();
  const month = slViewDate.getMonth();
  const entries = slEntriesForMonth(year, month);
  if (entries.length === 0) { alert(i18n[currentLang].emptyMonth); return; }
  const t = i18n[currentLang];

  const headers = [t.dateCol, t.dayCol, t.shiftCol, t.startCol, t.endCol, t.baseCol, t.otCol, t.totalCol, t.phCol, t.reasonCol, t.notesCol];
  const rows = [headers];

  entries.forEach(e => {
    const base = slHours(e.start, e.end);
    const total = base + (e.ot || 0);
    rows.push([
      slISOtoDisplay(e.date),
      slDayName(e.date),
      t[e.type],
      e.start,
      e.end,
      base.toFixed(2),
      (e.ot || 0).toFixed(2),
      total.toFixed(2),
      e.ph ? "PH" : "",
      e.reason || "",
      e.notes || ""
    ]);
  });

  const sumBase = entries.reduce((a, e) => a + slHours(e.start, e.end), 0);
  const sumOT = entries.reduce((a, e) => a + (e.ot || 0), 0);
  rows.push(["", "", "", "", t.totalHours, sumBase.toFixed(2), sumOT.toFixed(2), (sumBase + sumOT).toFixed(2), "", "", ""]);

  const csv = rows.map(r => r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  const monthsEN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  a.download = `ShiftLog_${monthsEN[month]}_${year}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

function shiftLogExportJSON() {
  const year = slViewDate.getFullYear();
  const month = slViewDate.getMonth();
  const entries = slEntriesForMonth(year, month);
  const monthsEN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  const blob = new Blob([JSON.stringify({ month: `${monthsEN[month]}_${year}`, entries }, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ShiftLog_${monthsEN[month]}_${year}.json`;
  a.click();
  URL.revokeObjectURL(url);
}

function shiftLogPrint() {
  document.body.classList.add("sl-printing");
  setTimeout(() => {
    window.print();
    setTimeout(() => document.body.classList.remove("sl-printing"), 500);
  }, 100);
}
// ==========================================
// SHIFT LOG MODULE — END
// ==========================================

// ==========================================
// GENERAL ACTIONS
// ==========================================
function toggleLang() {
  currentLang = currentLang === "ms" ? "en" : "ms";
  localStorage.setItem("noja_lang", currentLang);
  renderTexts();
  renderTasks();
  renderAdhoc();
  if (document.getElementById("galleryModal").style.display === "flex") {
    renderGallery();
  }
  renderShiftLog();
}

function saveAdhoc(index, val) {
  adhocData[index] = val;
  localStorage.setItem(K_ADHOC, JSON.stringify(adhocData));
}

document.getElementById("mainNotes").addEventListener("input", (e) => {
  localStorage.setItem(K_NOTES, e.target.value);
});

function resetAll() {
  if (confirm(i18n[currentLang].resetConfirm)) {
    checksData = {};
    adhocData = {};
    notesData = "";
    localStorage.removeItem(K_CHECKS);
    localStorage.removeItem(K_ADHOC);
    localStorage.removeItem(K_NOTES);
    document.getElementById("mainNotes").value = "";
    renderTasks();
    renderAdhoc();
    document.querySelectorAll(".task input[type=checkbox]").forEach(c => c.checked = false);
  }
}

function expandAll() {
  document.querySelectorAll(".section").forEach(s => s.classList.toggle("open"));
}

// ==========================================
// BACKUP & RESTORE DATA
// ==========================================
function backupJSON() {
  const backupData = {
    tasksMorning: tasksMorning,
    tasksEvening: tasksEvening,
    checks: checksData,
    adhoc: adhocData,
    notes: notesData,
    gallery: galleryData,
    shiftLog: shiftLogData
  };

  const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `NojaMasjid_Backup_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  alert(i18n[currentLang].backupDone);
}

function restoreJSON(input) {
  const file = input.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      const data = JSON.parse(e.target.result);
      if (data.tasksMorning && data.tasksEvening) {
        tasksMorning = data.tasksMorning;
        tasksEvening = data.tasksEvening;
        checksData = data.checks || {};
        adhocData = data.adhoc || {};
        notesData = data.notes || "";
        galleryData = data.gallery || [];
        shiftLogData = data.shiftLog || [];

        localStorage.setItem(K_TASKS_M, JSON.stringify(tasksMorning));
        localStorage.setItem(K_TASKS_E, JSON.stringify(tasksEvening));
        localStorage.setItem(K_CHECKS, JSON.stringify(checksData));
        localStorage.setItem(K_ADHOC, JSON.stringify(adhocData));
        localStorage.setItem(K_NOTES, notesData);
        localStorage.setItem(K_GALLERY, JSON.stringify(galleryData));
        localStorage.setItem(K_SHIFTLOG, JSON.stringify(shiftLogData));

        alert(i18n[currentLang].restoreSuccess);
        location.reload();
      } else {
        alert(i18n[currentLang].restoreError);
      }
    } catch (err) {
      alert(i18n[currentLang].restoreError);
    }
  };
  reader.readAsText(file);
  input.value = "";
}

// ==========================================
// REAL-TIME CLOCK
// ==========================================
function tick() {
  const now = new Date();
  const langCode = currentLang === "ms" ? "ms-SG" : "en-SG";

  const dateStr = now.toLocaleDateString(langCode, {
    weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
  });

  document.getElementById("dateDisplay").textContent = dateStr;
  document.getElementById("clock").textContent = now.toLocaleTimeString(langCode, { hour12: false });
}
setInterval(tick, 1000);

// ==========================================
// INITIALIZE APP
// ==========================================
function init() {
  document.getElementById("mainNotes").value = notesData;
  renderTexts();
  renderTasks();
  renderAdhoc();
  slApplyLabels();
  tick();

  const firstSec = document.getElementById("sec0");
  if (firstSec) firstSec.classList.add("open");
}

init();
</script>
